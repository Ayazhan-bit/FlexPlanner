<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Фитнес Трекер</title>
  <style>
    :root {
        --primary-grad: linear-gradient(90deg, #815bf5 0%, #eb5da0 100%);
        --bg-color: #eef2f7; /* Контрастный фон */
    }

    body {
        font-family: 'Inter', -apple-system, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .header {
        width: 100%;
        max-width: 500px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 20px;
        box-sizing: border-box;
    }

    .header h1 { font-size: 24px; color: #1e293b; margin: 0; }

    .main-card {
        background: white;
        padding: 50px 30px;
        border-radius: 35px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.07);
        text-align: center;
        width: 350px;
        margin-top: 20px;
    }

    .avatar-bg {
        width: 80px; height: 80px;
        background: #f5f3ff;
        border-radius: 20px;
        margin: 0 auto 30px;
        display: flex; align-items: center; justify-content: center;
        color: #d8ccff; font-size: 40px;
    }

    .btn-main {
        background: var(--primary-grad);
        color: white;
        border: none;
        padding: 16px 40px;
        border-radius: 18px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
        transition: all 0.2s ease;
        outline: none;
    }

    .btn-main:hover {
        filter: brightness(1.1);
        box-shadow: 0 8px 20px rgba(129, 91, 245, 0.2);
    }

    .btn-main:active {
        filter: brightness(1.4); /* Кнопка становится очень яркой при нажатии */
        transform: scale(0.97);
    }

    /* Модальное окно */
    .modal-overlay {
        display: none; position: fixed;
        top:0; left:0; width:100%; height:100%;
        background: rgba(30, 41, 59, 0.4);
        backdrop-filter: blur(8px);
        justify-content: center; align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background: white; padding: 35px; border-radius: 30px;
        width: 340px; position: relative;
        box-shadow: 0 25px 50px rgba(0,0,0,0.1);
    }

    .close-btn { position: absolute; top: 20px; right: 20px; color: #94a3b8; cursor: pointer; font-size: 20px; }

    .progress-line { display: flex; gap: 8px; margin: 20px 0 30px; }
    .p-dot { height: 6px; flex: 1; background: #f1f5f9; border-radius: 10px; }
    .p-dot.active { background: var(--primary-grad); }

    input {
        width: 100%; padding: 14px; margin: 8px 0 20px;
        border: 1px solid #e2e8f0; border-radius: 15px;
        background: #f8fafc; box-sizing: border-box;
        font-size: 14px;
    }

    .goal-option {
        border: 1px solid #e2e8f0; padding: 20px; border-radius: 20px;
        margin-bottom: 15px; cursor: pointer; transition: 0.2s;
        background: #ffffff;
    }
    .goal-option.selected {
        border: 2px solid #815bf5;
        background: #f5f3ff;
    }

    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>

<div class="header">
  <h1>Фитнес Трекер</h1>
  <div style="background: var(--primary-grad); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">👤</div>
</div>

<div class="main-card">
  <div class="avatar-bg">👤</div>
  <h2 style="margin: 0 0 10px; color: #1e293b;">Добро пожаловать!</h2>
  <p style="color: #64748b; font-size: 14px; margin-bottom: 40px; line-height: 1.5;">Создайте профиль, чтобы начать отслеживать свой прогресс</p>
  <button class="btn-main" onclick="openModal()">Создать профиль</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">✕</span>
    <form th:action="@{/register}" th:object="${user}" method="post">
      <div class="step active" id="step1">
        <h3 style="margin-top:0">Регистрация</h3>
        <div class="progress-line"><div class="p-dot active"></div><div class="p-dot"></div><div class="p-dot"></div></div>
        <label style="font-size: 13px; font-weight: 600; color: #475569;">Email</label>
        <input type="email" th:field="*{email}" placeholder="your@email.com" required>
        <label style="font-size: 13px; font-weight: 600; color: #475569;">Пароль</label>
        <input type="password" th:field="*{password}" placeholder="••••••••" required>
        <button type="button" class="btn-main" onclick="nextStep(2)">Далее</button>
      </div>

      <div class="step" id="step2">
        <h3 style="margin-top:0">Параметры</h3>
        <div class="progress-line"><div class="p-dot active"></div><div class="p-dot active"></div><div class="p-dot"></div></div>
        <input type="number" th:field="*{height}" placeholder="Рост (см)" required>
        <input type="number" th:field="*{weight}" placeholder="Вес (кг)" required>
        <input type="number" th:field="*{age}" placeholder="Возраст" required>
        <button type="button" class="btn-main" onclick="nextStep(3)">Далее</button>
      </div>

      <div class="step" id="step3">
        <h3 style="margin-top:0">Выберите цель</h3>
        <div class="progress-line"><div class="p-dot active"></div><div class="p-dot active"></div><div class="p-dot active"></div></div>
        <input type="hidden" th:field="*{goal}" id="goalInput">
        <div class="goal-option" onclick="selectGoal('Сброс веса', this)"><b>Сброс веса</b><br><small style="color: #64748b;">Уменьшение массы тела</small></div>
        <div class="goal-option" onclick="selectGoal('Набор массы', this)"><b>Набор массы</b><br><small style="color: #64748b;">Увеличение мышечной массы</small></div>
        <button type="submit" class="btn-main">Завершить</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openModal() { document.getElementById('modal').style.display = 'flex'; }
  function closeModal() { document.getElementById('modal').style.display = 'none'; }
  function nextStep(n) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + n).classList.add('active');
  }
  function selectGoal(v, el) {
      document.getElementById('goalInput').value = v;
      document.querySelectorAll('.goal-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
  }
</script>
</body>
</html>
